name: Build AdadRoozaneh APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Android project files
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/mahroo2016/adadroozaneh

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AdadRoozaneh"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=false
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.mahroo2016.adadroozaneh'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.mahroo2016.adadroozaneh'
                  minSdk 23
                  targetSdk 28
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:label="عدد روزانه"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:supportsRtl="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/mahroo2016/adadroozaneh/MainActivity.java <<'EOF'
          package com.mahroo2016.adadroozaneh;

          import android.app.Activity;
          import android.app.AlertDialog;
          import android.os.Bundle;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.view.Gravity;
          import android.view.ViewGroup;
          import android.widget.*;
          import android.text.InputType;
          import org.json.JSONArray;
          import org.json.JSONObject;
          import java.text.DecimalFormat;
          import java.util.Locale;

          public class MainActivity extends Activity {
              private final int deep = Color.rgb(34, 17, 55);
              private final int purple = Color.rgb(103, 57, 158);
              private final int light = Color.rgb(239, 229, 255);
              private int page = 1;
              private JSONArray[] data = { new JSONArray(), new JSONArray() };
              private android.content.SharedPreferences prefs;
              private LinearLayout list;
              private TextView total;
              private EditText input;

              @Override public void onCreate(Bundle state) {
                  super.onCreate(state);
                  prefs = getSharedPreferences("daily_numbers", MODE_PRIVATE);
                  load(1);
                  load(2);
                  showPage(1);
              }

              private int dp(float v) {
                  return (int)(v * getResources().getDisplayMetrics().density + 0.5f);
              }

              private GradientDrawable rounded(int color, int radius) {
                  GradientDrawable d = new GradientDrawable();
                  d.setColor(color);
                  d.setCornerRadius(dp(radius));
                  return d;
              }

              private TextView label(String value, int size, int color, boolean bold) {
                  TextView t = new TextView(this);
                  t.setText(value);
                  t.setTextSize(size);
                  t.setTextColor(color);
                  t.setGravity(Gravity.CENTER);
                  t.setPadding(dp(8), dp(8), dp(8), dp(8));
                  if (bold) t.setTypeface(Typeface.DEFAULT, Typeface.BOLD);
                  return t;
              }

              private Button button(String value, int color) {
                  Button b = new Button(this);
                  b.setText(value);
                  b.setTextColor(Color.WHITE);
                  b.setTextSize(14);
                  b.setAllCaps(false);
                  b.setBackground(rounded(color, 16));
                  return b;
              }

              private String today() {
                  // Uses the Persian calendar available on Android.
                  java.util.Calendar c = new java.util.GregorianCalendar();
                  java.util.Date now = c.getTime();
                  java.text.SimpleDateFormat f =
                      new java.text.SimpleDateFormat("yyyy/MM/dd", new Locale("fa", "IR"));
                  f.setCalendar(new java.util.GregorianCalendar(new java.util.Locale("fa", "IR")));
                  try {
                      java.util.Calendar pc = java.util.Calendar.getInstance(new Locale("fa", "IR"));
                      pc.setTime(now);
                      return new java.text.SimpleDateFormat("yyyy/MM/dd", new Locale("fa", "IR")).format(now);
                  } catch (Exception e) {
                      return new java.text.SimpleDateFormat("yyyy/MM/dd", Locale.getDefault()).format(now);
                  }
              }

              private void load(int p) {
                  try { data[p - 1] = new JSONArray(prefs.getString("page" + p, "[]")); }
                  catch (Exception e) { data[p - 1] = new JSONArray(); }
              }

              private void save() {
                  prefs.edit()
                      .putString("page1", data[0].toString())
                      .putString("page2", data[1].toString())
                      .apply();
              }

              private void showPage(int p) {
                  page = p;
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(dp(16), dp(12), dp(16), dp(12));
                  root.setBackgroundColor(deep);

                  ScrollView scroll = new ScrollView(this);
                  LinearLayout content = new LinearLayout(this);
                  content.setOrientation(LinearLayout.VERTICAL);
                  scroll.addView(content);
                  root.addView(scroll, new LinearLayout.LayoutParams(-1, 0, 1));

                  content.addView(label("عدد روزانه", 27, Color.WHITE, true));
                  content.addView(label("صفحه " + p, 17, Color.rgb(220, 198, 255), true));

                  LinearLayout card = new LinearLayout(this);
                  card.setOrientation(LinearLayout.VERTICAL);
                  card.setPadding(dp(12), dp(8), dp(12), dp(8));
                  card.setBackground(rounded(purple, 22));
                  card.addView(label("جمع کل صفحه " + p, 16, Color.WHITE, false));
                  total = label("۰", 32, Color.WHITE, true);
                  card.addView(total);
                  content.addView(card);

                  input = new EditText(this);
                  input.setSingleLine(true);
                  input.setHint("عدد را وارد کن");
                  input.setTextColor(Color.WHITE);
                  input.setHintTextColor(Color.LTGRAY);
                  input.setInputType(InputType.TYPE_CLASS_NUMBER | InputType.TYPE_NUMBER_FLAG_DECIMAL);
                  input.setPadding(dp(12), dp(10), dp(12), dp(10));
                  input.setBackground(rounded(Color.rgb(66, 45, 88), 14));
                  LinearLayout.LayoutParams inp = new LinearLayout.LayoutParams(-1, -2);
                  inp.setMargins(0, dp(12), 0, dp(6));
                  content.addView(input, inp);
                  content.addView(label("تاریخ امروز: " + today(), 14, Color.WHITE, false));

                  LinearLayout actions = new LinearLayout(this);
                  Button add = button("ثبت عدد", purple);
                  Button reset = button("ریست صفحه", Color.rgb(176, 54, 91));
                  actions.addView(add, new LinearLayout.LayoutParams(0, -2, 1));
                  LinearLayout.LayoutParams rlp = new LinearLayout.LayoutParams(0, -2, 1);
                  rlp.setMargins(dp(8), 0, 0, 0);
                  actions.addView(reset, rlp);
                  content.addView(actions);

                  Button next = button(p == 1 ? "رفتن به صفحه دوم  →" : "← بازگشت به صفحه اول",
                      Color.rgb(74, 126, 202));
                  LinearLayout.LayoutParams nlp = new LinearLayout.LayoutParams(-1, -2);
                  nlp.setMargins(0, dp(10), 0, dp(8));
                  content.addView(next, nlp);
                  content.addView(label("سوابق ثبت‌شده", 19, Color.WHITE, true));
                  list = new LinearLayout(this);
                  list.setOrientation(LinearLayout.VERTICAL);
                  content.addView(list);

                  add.setOnClickListener(v -> addEntry());
                  reset.setOnClickListener(v -> new AlertDialog.Builder(this)
                      .setTitle("پاک کردن اطلاعات؟")
                      .setMessage("فقط اطلاعات صفحه " + page + " پاک می‌شود.")
                      .setNegativeButton("لغو", null)
                      .setPositiveButton("پاک کن", (dialog, which) -> {
                          data[page - 1] = new JSONArray();
                          save();
                          render();
                      }).show());
                  next.setOnClickListener(v -> showPage(page == 1 ? 2 : 1));

                  setContentView(root);
                  render();
              }

              private void addEntry() {
                  String raw = input.getText().toString().trim();
                  if (raw.isEmpty()) {
                      input.setError("اول یک عدد وارد کن");
                      return;
                  }
                  try {
                      double value = Double.parseDouble(raw);
                      JSONObject obj = new JSONObject();
                      obj.put("date", today());
                      obj.put("value", value);
                      data[page - 1].put(obj);
                      save();
                      input.setText("");
                      render();
                  } catch (Exception e) {
                      Toast.makeText(this, "عدد معتبر نیست", Toast.LENGTH_SHORT).show();
                  }
              }

              private String fmt(double value) {
                  if (value == Math.floor(value)) return String.format(Locale.getDefault(), "%.0f", value);
                  return new DecimalFormat("0.##").format(value);
              }

              private void render() {
                  list.removeAllViews();
                  double sum = 0;
                  JSONArray arr = data[page - 1];
                  for (int i = arr.length() - 1; i >= 0; i--) {
                      JSONObject obj = arr.optJSONObject(i);
                      if (obj == null) continue;
                      double value = obj.optDouble("value", 0);
                      sum += value;
                      final int index = i;
                      LinearLayout row = new LinearLayout(this);
                      row.setGravity(Gravity.CENTER_VERTICAL);
                      row.setPadding(dp(6), dp(5), dp(6), dp(5));
                      row.setBackground(rounded(light, 14));
                      LinearLayout.LayoutParams rowp = new LinearLayout.LayoutParams(-1, -2);
                      rowp.setMargins(0, dp(5), 0, 0);
                      TextView info = label(obj.optString("date") + "\\n" + fmt(value), 14, deep, true);
                      row.addView(info, new LinearLayout.LayoutParams(0, -2, 1));
                      Button edit = button("اصلاح", purple);
                      Button del = button("حذف", Color.rgb(176, 54, 91));
                      row.addView(edit);
                      row.addView(del);
                      list.addView(row, rowp);
                      edit.setOnClickListener(v -> editEntry(index, value));
                      del.setOnClickListener(v -> new AlertDialog.Builder(this)
                          .setMessage("این عدد حذف شود؟")
                          .setNegativeButton("لغو", null)
                          .setPositiveButton("حذف", (dialog, which) -> {
                              JSONArray fresh = new JSONArray();
                              for (int j = 0; j < data[page - 1].length(); j++) {
                                  if (j != index) fresh.put(data[page - 1].opt(j));
                              }
                              data[page - 1] = fresh;
                              save();
                              render();
                          }).show());
                  }
                  total.setText(fmt(sum));
              }

              private void editEntry(int index, double oldValue) {
                  EditText edit = new EditText(this);
                  edit.setInputType(InputType.TYPE_CLASS_NUMBER | InputType.TYPE_NUMBER_FLAG_DECIMAL);
                  edit.setText(fmt(oldValue));
                  new AlertDialog.Builder(this).setTitle("اصلاح عدد").setView(edit)
                      .setNegativeButton("لغو", null)
                      .setPositiveButton("ذخیره", (dialog, which) -> {
                          try {
                              double value = Double.parseDouble(edit.getText().toString().trim());
                              data[page - 1].optJSONObject(index).put("value", value);
                              save();
                              render();
                          } catch (Exception e) {
                              Toast.makeText(this, "عدد معتبر نیست", Toast.LENGTH_SHORT).show();
                          }
                      }).show();
              }
          }
          EOF

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AdadRoozaneh-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
