name: Build AdadRoozaneh APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Android project files
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/mahroo2016/adadroozaneh app/src/main/res/drawable

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AdadRoozaneh"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=false
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.mahroo2016.adadroozaneh'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.mahroo2016.adadroozaneh'
                  minSdk 23
                  targetSdk 28
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > app/src/main/res/drawable/ic_launcher.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="48dp" android:height="48dp"
              android:viewportWidth="48" android:viewportHeight="48">
              <path android:fillColor="#67399E" android:pathData="M0,0h48v48h-48z" />
              <path android:fillColor="#FFFFFF" android:pathData="M10,9h28v30h-28z" />
              <path android:fillColor="#67399E" android:pathData="M15,14h3v3h-3zM21,14h12v3h-12zM15,22h3v3h-3zM21,22h12v3h-12zM15,30h3v3h-3zM21,30h12v3h-12z" />
          </vector>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:label="عدد روزانه"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:supportsRtl="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/mahroo2016/adadroozaneh/MainActivity.java <<'EOF'
          package com.mahroo2016.adadroozaneh;
          
          import android.app.Activity;
          import android.app.AlertDialog;
          import android.os.Bundle;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.view.Gravity;
          import android.widget.*;
          import android.text.InputType;
          import org.json.JSONArray;
          import org.json.JSONObject;
          import java.util.*;
          
          public class MainActivity extends Activity {
              private final int deep=Color.rgb(34,17,55), purple=Color.rgb(103,57,158), light=Color.rgb(239,229,255);
              private int page=1, selectedYear, selectedMonth, selectedDay;
              private JSONArray[] data={new JSONArray(),new JSONArray()};
              private android.content.SharedPreferences prefs;
              private LinearLayout list;
              private TextView total, selectedDateView;
              private EditText input;
          
              @Override public void onCreate(Bundle b){super.onCreate(b);prefs=getSharedPreferences("daily_numbers",MODE_PRIVATE);load(1);load(2);
                  int[] j=gregorianToJalali(new GregorianCalendar().get(Calendar.YEAR),new GregorianCalendar().get(Calendar.MONTH)+1,new GregorianCalendar().get(Calendar.DAY_OF_MONTH));
                  selectedYear=j[0];selectedMonth=j[1];selectedDay=j[2];showPage(1);}
              private int dp(float v){return (int)(v*getResources().getDisplayMetrics().density+0.5f);}
              private GradientDrawable rounded(int c,int r){GradientDrawable d=new GradientDrawable();d.setColor(c);d.setCornerRadius(dp(r));return d;}
              private TextView label(String s,int size,int color,boolean bold){TextView t=new TextView(this);t.setText(s);t.setTextSize(size);t.setTextColor(color);t.setGravity(Gravity.CENTER);t.setPadding(dp(8),dp(8),dp(8),dp(8));if(bold)t.setTypeface(Typeface.DEFAULT,Typeface.BOLD);return t;}
              private Button button(String s,int c){Button b=new Button(this);b.setText(s);b.setTextColor(Color.WHITE);b.setTextSize(14);b.setAllCaps(false);b.setBackground(rounded(c,16));return b;}
              private String jalaliDate(){return String.format(Locale.US,"%04d/%02d/%02d",selectedYear,selectedMonth,selectedDay);}
              private int monthDays(int y,int m){if(m<=6)return 31;if(m<=11)return 30;return isLeapJalali(y)?30:29;}
              private boolean isLeapJalali(int jy){int[] g=jalaliToGregorian(jy,12,30);int[] back=gregorianToJalali(g[0],g[1],g[2]);return back[0]==jy&&back[1]==12&&back[2]==30;}
              private int[] gregorianToJalali(int gy,int gm,int gd){
                  int[] gdm={0,31,(isLeapGregorian(gy)?29:28),31,30,31,30,31,31,30,31,30,31};
                  int gy2=gy-1600,gm2=gm-1,gd2=gd-1;
                  long gdn=365L*gy2+(gy2+3)/4-(gy2+99)/100+(gy2+399)/400;
                  for(int i=0;i<gm2;i++)gdn+=gdm[i+1];gdn+=gd2;
                  long jdn=gdn-79;long jnp=jdn/12053; jdn%=12053;
                  int jy=979+(int)(33*jnp)+(int)(4*(jdn/1461));jdn%=1461;
                  if(jdn>=366){jy+=(int)((jdn-1)/365);jdn=(jdn-1)%365;}
                  int jm,jd;if(jdn<186){jm=1+(int)(jdn/31);jd=1+(int)(jdn%31);}else{jm=7+(int)((jdn-186)/30);jd=1+(int)((jdn-186)%30);}
                  return new int[]{jy,jm,jd};
              }
              private int[] jalaliToGregorian(int jy,int jm,int jd){
                  jy-=979;long jdn=365L*jy+(jy/33)*8+(jy%33+3)/4;
                  for(int i=1;i<jm;i++)jdn+=(i<=6?31:30);jdn+=jd-1;
                  long gdn=jdn+79;int gy=1600+(int)(400*(gdn/146097));gdn%=146097;
                  boolean leap=true;if(gdn>=36525){gdn--;gy+=(int)(100*(gdn/36524));gdn%=36524;if(gdn>=365)gdn++;}
                  gy+=(int)(4*(gdn/1461));gdn%=1461;if(gdn>=366){leap=false;gdn--;gy+=(int)(gdn/365);gdn%=365;}
                  int[] md={0,31,(leap?29:28),31,30,31,30,31,31,30,31,30,31};int gm=1;
                  while(gm<=12&&gdn>=md[gm]){gdn-=md[gm];gm++;}return new int[]{gy,gm,(int)gdn+1};
              }
              private boolean isLeapGregorian(int y){return y%4==0&&(y%100!=0||y%400==0);}
              private void load(int p){try{data[p-1]=new JSONArray(prefs.getString("page"+p,"[]"));}catch(Exception e){data[p-1]=new JSONArray();}}
              private void save(){prefs.edit().putString("page1",data[0].toString()).putString("page2",data[1].toString()).apply();}
              private void chooseDate(){
                  LinearLayout box=new LinearLayout(this);box.setOrientation(LinearLayout.VERTICAL);box.setPadding(dp(12),dp(8),dp(12),dp(8));
                  NumberPicker year=new NumberPicker(this),month=new NumberPicker(this),day=new NumberPicker(this);
                  year.setMinValue(1300);year.setMaxValue(1500);year.setValue(selectedYear);
                  month.setMinValue(1);month.setMaxValue(12);month.setValue(selectedMonth);
                  day.setMinValue(1);day.setMaxValue(monthDays(selectedYear,selectedMonth));day.setValue(Math.min(selectedDay,day.getMaxValue()));
                  LinearLayout row=new LinearLayout(this);row.setGravity(Gravity.CENTER);
                  row.addView(year,new LinearLayout.LayoutParams(0,dp(130),1));row.addView(month,new LinearLayout.LayoutParams(0,dp(130),1));row.addView(day,new LinearLayout.LayoutParams(0,dp(130),1));
                  box.addView(label("سال       ماه       روز",15,deep,true));box.addView(row);
                  NumberPicker.OnValueChangeListener listener=(picker,oldV,newV)->{day.setMaxValue(monthDays(year.getValue(),month.getValue()));if(day.getValue()>day.getMaxValue())day.setValue(day.getMaxValue());};
                  year.setOnValueChangedListener(listener);month.setOnValueChangedListener(listener);
                  new AlertDialog.Builder(this).setTitle("انتخاب تاریخ شمسی").setView(box).setNegativeButton("لغو",null).setPositiveButton("انتخاب",(d,w)->{
                      selectedYear=year.getValue();selectedMonth=month.getValue();selectedDay=day.getValue();selectedDateView.setText("تاریخ انتخاب‌شده: "+jalaliDate());
                  }).show();
              }
              private void showPage(int p){
                  page=p;LinearLayout root=new LinearLayout(this);root.setOrientation(1);root.setPadding(dp(16),dp(12),dp(16),dp(12));root.setBackgroundColor(deep);
                  ScrollView scroll=new ScrollView(this);LinearLayout content=new LinearLayout(this);content.setOrientation(1);scroll.addView(content);root.addView(scroll,new LinearLayout.LayoutParams(-1,0,1));
                  content.addView(label("عدد روزانه",27,Color.WHITE,true));content.addView(label("صفحه "+p,17,Color.rgb(220,198,255),true));
                  LinearLayout card=new LinearLayout(this);card.setOrientation(1);card.setPadding(dp(12),dp(8),dp(12),dp(8));card.setBackground(rounded(purple,22));card.addView(label("جمع کل صفحه "+p,16,Color.WHITE,false));total=label("۰",32,Color.WHITE,true);card.addView(total);content.addView(card);
                  input=new EditText(this);input.setSingleLine(true);input.setHint("عدد را وارد کن");input.setTextColor(Color.WHITE);input.setHintTextColor(Color.LTGRAY);input.setInputType(InputType.TYPE_CLASS_NUMBER|InputType.TYPE_NUMBER_FLAG_DECIMAL);input.setPadding(dp(12),dp(10),dp(12),dp(10));input.setBackground(rounded(Color.rgb(66,45,88),14));LinearLayout.LayoutParams ip=new LinearLayout.LayoutParams(-1,-2);ip.setMargins(0,dp(12),0,dp(6));content.addView(input,ip);
                  selectedDateView=label("تاریخ انتخاب‌شده: "+jalaliDate(),14,Color.WHITE,false);content.addView(selectedDateView);
                  Button pick=button("انتخاب تاریخ شمسی",Color.rgb(74,126,202));content.addView(pick);pick.setOnClickListener(v->chooseDate());
                  LinearLayout actions=new LinearLayout(this);Button add=button("ثبت عدد",purple),reset=button("ریست صفحه",Color.rgb(176,54,91));actions.addView(add,new LinearLayout.LayoutParams(0,-2,1));LinearLayout.LayoutParams rp=new LinearLayout.LayoutParams(0,-2,1);rp.setMargins(dp(8),0,0,0);actions.addView(reset,rp);content.addView(actions);
                  Button next=button(p==1?"رفتن به صفحه دوم  →":"← بازگشت به صفحه اول",Color.rgb(74,126,202));LinearLayout.LayoutParams np=new LinearLayout.LayoutParams(-1,-2);np.setMargins(0,dp(10),0,dp(8));content.addView(next,np);
                  content.addView(label("سوابق ثبت‌شده",19,Color.WHITE,true));list=new LinearLayout(this);list.setOrientation(1);content.addView(list);
                  add.setOnClickListener(v->addEntry());reset.setOnClickListener(v->new AlertDialog.Builder(this).setTitle("پاک کردن اطلاعات؟").setMessage("فقط اطلاعات صفحه "+page+" پاک می‌شود.").setNegativeButton("لغو",null).setPositiveButton("پاک کن",(d,w)->{data[page-1]=new JSONArray();save();render();}).show());next.setOnClickListener(v->showPage(page==1?2:1));setContentView(root);render();
              }
              private void addEntry(){String raw=input.getText().toString().trim();if(raw.isEmpty()){input.setError("اول یک عدد وارد کن");return;}try{double value=Double.parseDouble(raw);JSONObject o=new JSONObject();o.put("date",jalaliDate());o.put("value",value);data[page-1].put(o);save();input.setText("");render();}catch(Exception e){Toast.makeText(this,"عدد معتبر نیست",Toast.LENGTH_SHORT).show();}}
              private String fmt(double n){if(n==Math.floor(n))return String.format(Locale.US,"%.0f",n);return String.format(Locale.US,"%.2f",n);}
              private void render(){list.removeAllViews();double sum=0;JSONArray a=data[page-1];ArrayList<Integer> order=new ArrayList<>();for(int i=0;i<a.length();i++){JSONObject obj=a.optJSONObject(i);if(obj!=null){order.add(i);sum+=obj.optDouble("value",0);}}Collections.sort(order,(left,right)->{String dl=a.optJSONObject(left).optString("date","");String dr=a.optJSONObject(right).optString("date","");int cmp=dl.compareTo(dr);return cmp!=0?cmp:Integer.compare(left,right);});for(int position=0;position<order.size();position++){final int index=order.get(position);JSONObject o=a.optJSONObject(index);double value=o.optDouble("value",0);LinearLayout row=new LinearLayout(this);row.setGravity(Gravity.CENTER_VERTICAL);row.setPadding(dp(6),dp(5),dp(6),dp(5));row.setBackground(rounded(light,14));LinearLayout.LayoutParams rlp=new LinearLayout.LayoutParams(-1,-2);rlp.setMargins(0,dp(5),0,0);TextView info=label(o.optString("date")+"\n"+fmt(value),14,deep,true);row.addView(info,new LinearLayout.LayoutParams(0,-2,1));Button edit=button("اصلاح",purple),del=button("حذف",Color.rgb(176,54,91));row.addView(edit);row.addView(del);list.addView(row,rlp);edit.setOnClickListener(v->editEntry(index,value));del.setOnClickListener(v->new AlertDialog.Builder(this).setMessage("این عدد حذف شود؟").setNegativeButton("لغو",null).setPositiveButton("حذف",(d,w)->{JSONArray fresh=new JSONArray();for(int j=0;j<data[page-1].length();j++)if(j!=index)fresh.put(data[page-1].opt(j));data[page-1]=fresh;save();render();}).show());}total.setText(fmt(sum));}
              private void editEntry(int index,double old){EditText e=new EditText(this);e.setInputType(InputType.TYPE_CLASS_NUMBER|InputType.TYPE_NUMBER_FLAG_DECIMAL);e.setText(fmt(old));new AlertDialog.Builder(this).setTitle("اصلاح عدد").setView(e).setNegativeButton("لغو",null).setPositiveButton("ذخیره",(d,w)->{try{data[page-1].optJSONObject(index).put("value",Double.parseDouble(e.getText().toString().trim()));save();render();}catch(Exception ex){Toast.makeText(this,"عدد معتبر نیست",Toast.LENGTH_SHORT).show();}}).show();}
          }
          EOF

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AdadRoozaneh-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
